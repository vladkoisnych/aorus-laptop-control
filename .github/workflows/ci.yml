name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: the config parser uses tomllib
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile every Python file
        run: |
          python -m py_compile aorusctl
          python -m compileall -q tests

      - name: Import the tool without running it
        run: |
          python - <<'PY'
          import importlib.machinery, importlib.util
          loader = importlib.machinery.SourceFileLoader("aorusctl", "aorusctl")
          spec = importlib.util.spec_from_loader("aorusctl", loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          print("imported aorusctl", mod.VERSION)
          mod.build_parser().parse_args(["status", "--json"])
          print("argument parser builds")
          PY

      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Syntax
        run: for f in *.sh */*.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck -S warning *.sh */*.sh

      - name: Installer dry run
        # --check must never touch the machine, so it is safe to run in CI and
        # proves the happy path still executes end to end
        run: |
          sudo bash install.sh --check
          sudo bash install.sh --check --no-driver

  extension:
    name: gnome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install glib tools
        run: sudo apt-get update -qq && sudo apt-get install -y libglib2.0-dev-bin

      - name: Parse as ES modules
        run: |
          for f in gnome-extension/extension.js gnome-extension/prefs.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
            echo "ok $f"
          done

      - name: Compile the settings schema
        run: glib-compile-schemas --strict --dry-run gnome-extension/schemas/

      - name: Pack it the way GNOME would
        run: |
          cd gnome-extension
          mkdir -p /tmp/pack && cp -r . /tmp/pack/
          test -f /tmp/pack/metadata.json
          test -f /tmp/pack/extension.js
          test -f /tmp/pack/stylesheet.css
          python3 -c "import json,sys; m=json.load(open('/tmp/pack/metadata.json')); print('uuid', m['uuid'])"

  release:
    name: release guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match VERSION and the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 - <<'PY'
          import re
          src = open("aorusctl").read()
          print(re.search(r'^VERSION = "([^"]+)"', src, re.M).group(1))
          PY
          )
          echo "tag=$tag  VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match VERSION $version in aorusctl"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          echo "tag, VERSION and changelog agree"

  permissions:
    name: file modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scripts must be committed executable
        # A script committed as 644 reaches users as
        # "sudo: ./install.sh: command not found", which looks like a missing file
        run: |
          fail=0
          while read -r mode _ _ path; do
            case "$path" in
              *.sh|aorusctl)
                if [ "$mode" != "100755" ]; then
                  echo "::error file=$path::committed as $mode, expected 100755."
                  echo "  fix with: git update-index --chmod=+x $path"
                  fail=1
                fi ;;
            esac
          done < <(git ls-files -s)
          exit "$fail"

      - name: No Windows line endings
        # git grep -P needs a PCRE build, so do it in python instead. Binary
        # files hold \r\n by chance, so skip them the way git does: a NUL byte
        # in the first 8000 means binary.
        run: |
          python3 - <<'PY'
          import subprocess, sys
          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 check=True).stdout.decode().split("\0")
          bad = []
          for f in filter(None, files):
              try:
                  data = open(f, "rb").read()
              except OSError:
                  continue
              if b"\0" in data[:8000]:
                  continue
              if b"\r\n" in data:
                  bad.append(f)
          for f in bad:
              print(f"::error file={f}::CRLF line endings break the shebang on Linux")
          sys.exit(1 if bad else 0)
          PY
